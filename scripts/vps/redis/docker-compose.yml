# Redis for Hao's shared rate limits and caches (src/lib/server/redis.ts), on the VPS. Deploy it in Coolify as a
# Docker Compose resource; see scripts/vps/redis/README.md.
#
# The API routes run on EAS Hosting (Cloudflare Workers), which can't hold a Redis connection, so Redis is reached over
# HTTPS through serverless-redis-http, which speaks Upstash's REST protocol. Redis itself has no published port.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Only rate-limit counters and caches, every key with an expiry: no persistence, a memory cap, and the least recently
    # used keys dropped first when full. The password guards it inside the Docker network too.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --protected-mode yes
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      # The bearer token the app sends (REDIS_REST_TOKEN): long and random, e.g. `openssl rand -hex 32`.
      SRH_TOKEN: ${REDIS_REST_TOKEN:?set REDIS_REST_TOKEN}
      SRH_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379
    # Coolify's proxy gives this a domain with HTTPS (e.g. https://redis.acyrx.com → port 80). No host port.
    expose:
      - '80'
